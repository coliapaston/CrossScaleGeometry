[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-scale-geometry"
version = "0.1.0"
description = "Analysis pipelines for the geometry and linguistic structure of token embedding spaces"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
dependencies = [
    "huggingface-hub>=1.4,<2",
    "matplotlib>=3.10,<4",
    "numba>=0.61,<1",
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
    "safetensors>=0.7,<1",
    "scikit-learn>=1.7,<2",
    "scipy>=1.15,<2",
    "tokenizers>=0.22,<1",
    "torch>=2.10,<3",
    "transformers>=5.1,<6",
    "unicodedataplus>=16.0,<17",
]

[project.optional-dependencies]
gpu-cu12 = [
    "cuml-cu12>=25.12,<26",
    "cupy-cuda12x>=14,<15",
]
notebook = [
    "ipykernel>=7.2,<8",
    "jupyterlab>=4.5,<5",
    "seaborn>=0.13,<1",
]

[tool.setuptools.packages.find]
include = ["cluster_anlys*", "paper_tool*"]
